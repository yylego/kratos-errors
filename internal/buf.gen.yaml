version: v2
inputs:
  - directory: errorspb
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@latest"]
    out: errorspb
    opt: paths=source_relative
  - local: ["go", "run", "github.com/go-kratos/kratos/cmd/protoc-gen-go-errors/v3@latest"]
    out: errorspb
    opt: paths=source_relative
